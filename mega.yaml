Path of Exile:
  ################
  # Game Options #
  ################
  progression_balancing:
    # A system that can move progression earlier, to try and prevent the player from getting stuck and bored early.
    # 
    # A lower setting means more getting stuck. A higher setting means less getting stuck.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 99
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-99: 0 # random value between 0 and 99
    disabled: 0 # equivalent to 0
    normal: 50 # equivalent to 50
    extreme: 0 # equivalent to 99

  accessibility:
    # Set rules for reachability of your items/locations.
    # 
    # **Full:** ensure everything can be reached and acquired.
    # 
    # **Minimal:** ensure what is needed to reach your goal can be acquired.
    full: 50
    minimal: 0

  death_link:
    # When you die, everyone who enabled death link dies. Of course, the reverse is true too.
    'false': 50
    'true': 0

  ################
  # Goal Options #
  ################
  goal:
    # Specifies the goal of the world.
    # if your goal is act 5, you need to get to the 3rd area in act 6, kauri fortress, because of zone names.
    complete_the_campaign: 50
    complete_act_1: 0
    complete_act_2: 0
    complete_act_3: 0
    complete_act_4: 0
    kauri_fortress_act_6: 0
    complete_act_6: 0
    complete_act_7: 0
    complete_act_8: 0
    complete_act_9: 0
    defeat_bosses: 0

  number_of_bosses:
    # This is ignored if Goal isn't set to defeat_bosses. This specifies the number of bosses that need to be defeated
    # (and for you to pick up their drops) in order for you to goal. This will max out at the number of bosses available in the world.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 1
    # Maximum value is 31
    1: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-1-31: 0 # random value between 1 and 31

  bosses_available:
    # This is also ignored if Goal isn't set to defeat_bosses. Specifies the availability of the bosses in the world.
    # This will NOT determine how many bosses are available in the world, but rather which bosses can be randomized.
    # This will choose any (including _very_ difficult bosses if none are selected.)
    # 
    # valid choices: [ "hydra", "phoenix", "chimera", "minotaur", "shaper", "uber_shaper", "elder", "uber_elder",
    #  "uber_uber_elder", "atziri", "uber_atziri", "al-hezmin", "baran", "drox", "veritania", "sirus", "uber_sirus", "maven",
    #  "uber_maven", "exarch", "uber_exarch", "eater", "uber_eater", "incarnation_of_neglect", "uber_incarnation_of_neglect",
    #  "incarnation_of_fear", "uber_incarnation_of_fear", "incarnation_of_dread", "uber_incarnation_of_dread", "cortex", "uber_cortex"]
    ['hydra', 'phoenix', 'chimera', 'minotaur', 'al-hezmin', 'baran', 'drox', 'veritania']

  #####################
  # Character Options #
  #####################
  starting_character:
    # The starting character for the world. This will determine the class available at the start.
    scion: 0
    marauder: 0
    ranger: 0
    witch: 0
    duelist: 0
    templar: 0
    shadow: 0
    random: 50

  ascendancies_available_per_class:
    # Specifies the maximum number of available ascendancies per class.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 3
    1: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-3: 0 # random value between 0 and 3

  allow_unlock_of_other_characters:
    # Allows unlocking of other characters.
    'false': 0
    'true': 50

  usable_starting_gear:
    # Specifies if you should start with the gear that you find in the tutorial, for your starting character.
    # use this option if you don't want to punch hillock to death.
    no_starting_gear: 0
    starting_weapon: 0
    starting_weapon_and_flask_slots: 0
    starting_weapon_and_gems: 0
    starting_weapon_flask_and_gems: 50

  gucci_hobo_mode:
    # Specifies if the world should be in Gucci Hobo Mode, this restricts use of non-unique equipment.
    # This is an extremely difficult challenge intended for experienced players, and will greatly increase the length of your run.
    # Expect a very slow start, involving farming early act 1 zones. (not reccomended)
    disabled: 50
    allow_one_slot_of_any_rarity: 0
    allow_one_slot_of_normal_rarity: 0
    no_non_unique_items: 0

  ######################
  # Generation Options #
  ######################
  progressive_gear:
    # Controls whether gear rarity follows a progressive unlock system. Progressive gear is recommended for better game balance and pacing.
    # When enabled, you'll receive gear upgrades that will increase in rarity.
    # When disabled, you can receive gear of any rarity (you might find rare items before normal ones).
    enabled: 50
    disabled: 0
    progressive_except_for_unique: 0

