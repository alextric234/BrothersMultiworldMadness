CloverPit:
  ################
  # Game Options #
  ################
  progression_balancing:
    # A system that can move progression earlier, to try and prevent the player from getting stuck and bored early.
    # 
    # A lower setting means more getting stuck. A higher setting means less getting stuck.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 99
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-99: 0 # random value between 0 and 99
    disabled: 0 # equivalent to 0
    normal: 50 # equivalent to 50
    extreme: 0 # equivalent to 99

  accessibility:
    # Set rules for reachability of your items/locations.
    # 
    # **Full:** ensure everything can be reached and acquired.
    # 
    # **Minimal:** ensure what is needed to reach your goal can be acquired.
    full: 50
    minimal: 0

  goal_type:
    # Goals:
    # Key goal: Go out the door with specific key
    # 
    # Deadline: Beat deadline x, y amount of times
    # 
    # Memory Packs: Beat x amount of unique memory packs
    key: 50
    deadline: 0
    memory_packs: 0

  ending_type:
    # For key ending:
    # Bad ending: Go out the door with skeleton key
    # Good ending: Go out the door with sacred key (999 + skeleton key)
    skeleton_key_bad_ending: 50
    sacred_key_good_ending: 0

  deadline_goal:
    # Determines what deadline should be reached to beat deadline goal
    # (Goal: Beat deadline x, y amount of times)
    # This is x
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 8
    # Maximum value is 25
    12: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-8-25: 0 # random value between 8 and 25

  deadline_amount:
    # Determines how many of the deadlines should be beat to goal
    # (Goal: Beat deadline x, y amount of times)
    # This is y
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 1
    # Maximum value is 25
    5: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-1-25: 0 # random value between 1 and 25

  memory_goal:
    # Determines how many memory cards should be beat to goal
    # (Goal: Beat x amount of unique memory packs)
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 1
    # Maximum value is 19
    3: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-1-19: 0 # random value between 1 and 19

  extra_checks:
    # [Sacred]
    # Adds all sacred/holy charms and calls as locations
    # (14 locations) - (Only recommended for ASync)
    # 
    # [Memory]
    # Adds all memory cards as locations
    # (19 locations) - (Only recommended for ASync)
    'off': 50
    sacred: 0
    memory: 0
    both: 0

  clover_trap_percent:
    # How many of your clover tickets are lost when reciving a clover trap
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 25
    # Maximum value is 100
    50: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-25-100: 0 # random value between 25 and 100

  coin_trap_percent:
    # How many of your coins are lost when reciving a clover trap
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 25
    # Maximum value is 100
    50: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-25-100: 0 # random value between 25 and 100

  trap_amount:
    # How many clover and coin traps there will be of each
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 25
    7: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-25: 0 # random value between 0 and 25

  deathlink:
